name: release

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: richespay-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  deploy-staging:
    needs: verify
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Apply backward-compatible migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --yes
      - name: Build release images
        run: |
          docker build -f apps/api/Dockerfile -t richespay-api:staging .
          docker build -f apps/api/Dockerfile.worker -t richespay-worker:staging .
          docker build -f apps/dashboard/Dockerfile -t richespay-dashboard:staging .
          docker build -f apps/admin/Dockerfile -t richespay-admin:staging .
          docker build -f apps/checkout/Dockerfile -t richespay-checkout:staging .
          docker build -f apps/docs/Dockerfile -t richespay-docs:staging .
      - name: Rolling restart on staging hosts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh -o StrictHostKeyChecking=accept-new "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' < deploy/rolling-restart.sh

  approve-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production
    steps:
      - run: echo "Production environment protection must require a reviewer."

  deploy-production:
    needs: approve-production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Apply backward-compatible migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --yes
      - name: Build production images
        run: |
          docker build -f apps/api/Dockerfile -t richespay-api:production .
          docker build -f apps/api/Dockerfile.worker -t richespay-worker:production .
          docker build -f apps/dashboard/Dockerfile -t richespay-dashboard:production .
          docker build -f apps/admin/Dockerfile -t richespay-admin:production .
          docker build -f apps/checkout/Dockerfile -t richespay-checkout:production .
          docker build -f apps/docs/Dockerfile -t richespay-docs:production .
      - name: Rolling restart on production hosts
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh -o StrictHostKeyChecking=accept-new "$DEPLOY_USER@$DEPLOY_HOST" 'bash -s' < deploy/rolling-restart.sh
